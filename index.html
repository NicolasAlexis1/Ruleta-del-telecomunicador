<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta de Selección - Telecomunicaciones</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f1511;
      --bg-card: #19231c;
      --accent-gold: #d4af37;
      --accent-gold-hover: #f1c40f;
      --accent-red: #c0392b;
      --accent-green: #2e7d32;
      --text-light: #f1f5f2;
      --border-color: #2d3e31;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #ffffff; /* <-- LÍNEA 30: Fondo blanco para la franja superior */
      border-bottom: 3px solid var(--accent-gold);
      padding: 12px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .header-logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-logo {
      height: 55px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }

    .header-title {
      text-align: center;
      flex-grow: 1;
    }

    .header-title h1 {
      font-size: 2rem;
      color: var(--accent-gold);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 800;
    }

    .header-title p {
      font-size: 1.5rem;
      color: #a0b0a3;
      margin-top: 2px;
    }

    .main-container {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      flex-grow: 1;
    }

    @media (max-width: 900px) {
      .main-container {
        grid-template-columns: 1fr;
      }
    }

    .wheel-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .wheel-controls {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
      background: #111813;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .wheel-controls label {
      font-size: 0.85rem;
      color: var(--accent-gold);
      font-weight: bold;
    }

    .wheel-controls select {
      background: #19231c;
      color: #fff;
      border: 1px solid var(--accent-gold);
      padding: 4px 10px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      font-weight: bold;
    }

    .wheel-wrapper {
      position: relative;
      width: 100%;
      max-width: 520px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #wheelCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
    }

    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 32px solid var(--accent-gold);
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.7));
    }

    .btn-spin {
      margin-top: 20px;
      padding: 14px 45px;
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #1b5e20, #2e7d32);
      border: 2px solid var(--accent-gold);
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      letter-spacing: 1px;
    }

    .btn-spin:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(46, 125, 50, 0.5);
      background: linear-gradient(135deg, #2e7d32, #388e3c);
    }

    .btn-spin:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: #666;
    }

    .panel-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-section h2 {
      font-size: 1rem;
      color: var(--accent-gold);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .count-badge {
      background: var(--accent-green);
      color: white;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-group label {
      font-size: 0.8rem;
      color: #a0b0a3;
    }

    .filter-group select, .filter-group input {
      padding: 8px;
      background: #111813;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      outline: none;
      font-size: 0.85rem;
    }

    .input-group {
      display: flex;
      gap: 6px;
    }

    .btn-add {
      padding: 8px 12px;
      background: var(--accent-green);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .name-list {
      list-style: none;
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border: 1px solid var(--border-color);
      padding: 6px;
      border-radius: 6px;
      background: #111813;
    }

    .name-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #19231c;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      border-left: 3px solid var(--accent-gold);
    }

    .btn-delete {
      background: transparent;
      color: #e74c3c;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      padding: 0 4px;
    }

    .btn-reset {
      margin-top: auto;
      padding: 8px;
      background: transparent;
      color: #a0b0a3;
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-reset:hover {
      color: var(--accent-gold);
      border-color: var(--accent-gold);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--bg-card);
      border: 2px solid var(--accent-gold);
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    }

    .modal-card h3 {
      color: var(--accent-gold);
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .winner-name {
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
      margin: 20px 0;
      line-height: 1.3;
      background: #111813;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-modal {
      padding: 10px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .btn-modal-close { background: #444; color: white; }
    .btn-modal-remove { background: var(--accent-red); color: white; }
  </style>
</head>

    let audioCtx = null;
    let drumInterval = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playDrumRoll(duration) {
      initAudio();
      if (!audioCtx) return;

      let intervalTime = 120;
      const startTime = Date.now();

      function playHit() {
        const now = Date.now();
        const elapsed = now - startTime;
        if (elapsed >= duration) return;

        const bufferSize = audioCtx.sampleRate * 0.05;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(800 + (elapsed / duration) * 400, audioCtx.currentTime);
        filter.Q.setValueAtTime(3, audioCtx.currentTime);

        const gain = audioCtx.createGain();
        const volume = 0.15 + (elapsed / duration) * 0.25;
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

        whiteNoise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        whiteNoise.start();

        intervalTime = Math.max(30, 120 - (elapsed / duration) * 90);
        drumInterval = setTimeout(playHit, intervalTime);
      }

      playHit();
    }

    function stopDrumRoll() {
      if (drumInterval) clearTimeout(drumInterval);
    }

    function playFanfare() {
      initAudio();
      if (!audioCtx) return;

      const notes = [261.63, 329.63, 392.00, 523.25];
      notes.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.1);
        
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + index * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.1 + 0.4);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + index * 0.1);
        osc.stop(audioCtx.currentTime + index * 0.1 + 0.4);
      });
    }

        const matchesQuery = item.toLowerCase().includes(query);
        return matchesGrade && matchesQuery;
      });

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numSegments === 0) {
        ctx.fillStyle = '#a0b0a3';
        ctx.font = '20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Sin participantes seleccionados', canvas.width / 2, canvas.height / 2);
        return;
      }

      const arcSize = (2 * Math.PI) / numSegments;
      const radius = canvas.width / 2;

      for (let i = 0; i < numSegments; i++) {
        const angle = currentAngle + i * arcSize;
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius - 6, angle, angle + arcSize);
        ctx.lineTo(radius, radius);
        ctx.fill();
        ctx.strokeStyle = '#d4af37';
        ctx.lineWidth = numSegments > 40 ? 1 : 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        
        let fontSize = 16;
        if (numSegments > 50) fontSize = 8;
        else if (numSegments > 30) fontSize = 10;
        else if (numSegments > 15) fontSize = 12;

        ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
        ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
        ctx.shadowBlur = 3;

        let displayName = activeList[i];
        if (numSegments > 40 && displayName.length > 25) {
          displayName = displayName.substring(0, 23) + '..';
        }

        ctx.fillText(displayName, radius - 20, fontSize / 3);
        ctx.restore();
      }
    }

    function spin() {
      if (isSpinning || activeList.length === 0) return;

      isSpinning = true;
      spinBtn.disabled = true;

      const duration = parseInt(durationSelect.value, 10);
      playDrumRoll(duration);

      const spinRounds = 6 + Math.floor(Math.random() * 6);
      const extraAngle = Math.random() * Math.PI * 2;
      const totalRotation = spinRounds * Math.PI * 2 + extraAngle;

      const startAngle = currentAngle;
      const startTime = performance.now();

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        if (elapsed < duration) {
          const easeOut = 1 - Math.pow(1 - elapsed / duration, 3);
          currentAngle = startAngle + totalRotation * easeOut;
          drawWheel();
          requestAnimationFrame(animate);
        } else {
          stopDrumRoll();
          currentAngle = (startAngle + totalRotation) % (Math.PI * 2);
          drawWheel();
          isSpinning = false;
          spinBtn.disabled = false;
          calculateWinner();
        }
      }

      requestAnimationFrame(animate);
    }

    function calculateWinner() {
      const numSegments = activeList.length;
      const arcSize = (2 * Math.PI) / numSegments;
      const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI)) - Math.PI / 2 + Math.PI * 2) % (Math.PI * 2);
      
      selectedIndex = Math.floor(normalizedAngle / arcSize) % numSegments;
      const winner = activeList[selectedIndex];

      winnerNameEl.textContent = winner;
      winnerModal.classList.add('active');

      playFanfare();

      if (window.confetti) {
        confetti({
          particleCount: 120,
          spread: 80,
          origin: { y: 0.6 }
        });
      }
    }

    function addName() {
      const name = nameInput.value.trim().toUpperCase();
      if (name) {
        fullPersonnelList.push(name);
        nameInput.value = '';
        applyFilters();
      }
    }

    window.removeName = function(index) {
      const targetName = activeList[index];
      const fullIndex = fullPersonnelList.indexOf(targetName);
      if (fullIndex !== -1) {
        fullPersonnelList.splice(fullIndex, 1);
      }
      applyFilters();
    };

    gradeFilter.addEventListener('change', applyFilters);
    searchInput.addEventListener('input', applyFilters);
    addBtn.addEventListener('click', addName);
    nameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addName(); });
    spinBtn.addEventListener('click', spin);

    resetBtn.addEventListener('click', () => {
      location.reload();
    });

    modalCloseBtn.addEventListener('click', () => { winnerModal.classList.remove('active'); });
    modalRemoveBtn.addEventListener('click', () => {
      if (selectedIndex !== -1) {
        removeName(selectedIndex);
        winnerModal.classList.remove('active');
      }
    });

    applyFilters();
  </script>
</body>
</html>
